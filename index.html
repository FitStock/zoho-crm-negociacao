<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Negociação - Fitstock</title>
    <!-- ZOHO CRM WIDGET SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #ffffff;
            color: #1e293b;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        select, input {
            width: 100%;
            padding: 9px 11px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            background: #fff;
        }
        select:focus, input:focus { outline: none; border-color: #2563eb; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #1d4ed8; }
        .status { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 6px; display: none; }
        .status.loading { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="form-group">
    <label for="responsavelSelect">Responsável</label>
    <select id="responsavelSelect" disabled aria-describedby="responsavelStatus"></select>
    <small id="responsavelStatus" role="status" style="display:block;margin-top:5px;color:#64748b;">Carregando responsáveis...</small>
</div>
<div class="form-group">
    <label for="empresaSelect">Empresa Parceira (dos Contacts associados)</label>
    <select id="empresaSelect" onchange="aoSelecionarEmpresa()">
        <option value="">Carregando empresas...</option>
    </select>
</div>

<div class="form-group">
    <label for="contatoSelect">Contato associado da Empresa (Opcional)</label>
    <select id="contatoSelect">
        <option value="">Selecione primeiro uma empresa</option>
    </select>
</div>

<div id="avisos" role="status" style="font-size:12px; color:#92400e; margin-bottom:12px;"></div>

<div id="dadosOpp" role="note" style="font-size:13px; margin-bottom:12px;"></div>
<div class="row">
    <div class="form-group">
        <label for="quantidadeOppInput">Quantidade</label>
        <input type="number" step="any" min="0" id="quantidadeOppInput" oninput="atualizarCamposOpp()">
        <small id="qtdArredondada" aria-live="polite"></small>
    </div>
    <div class="form-group">
        <label for="precoOppInput">Preço</label>
        <input type="number" step="0.01" min="0" id="precoOppInput">
    </div>
</div>
<div class="row">
    <div class="form-group">
        <label for="moedaOppSelect">Moeda</label>
        <select id="moedaOppSelect" onchange="atualizarCamposOpp()">
            <option value="">Não informada</option>
            <option value="BRL">BRL</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
        </select>
    </div>
    <div class="form-group">
        <label for="validadeOppInput">Validade do produto</label>
        <input type="date" id="validadeOppInput">
    </div>
</div>
<div id="moedaAviso" style="font-size:12px; color:#475569; margin-bottom:14px;">Trocar a moeda não converte o preço automaticamente. Revise também o preço desejado, se preenchido.</div>

<div class="row">
    <div class="form-group">
        <label for="qtdInput">Quantidade Desejada (Opcional)</label>
        <input type="number" step="any" min="0" id="qtdInput" placeholder="Ex: 1000">
    </div>
    <div class="form-group">
        <label for="precoInput">Preço Unitário Desejado (Opcional)</label>
        <input type="number" step="0.01" min="0" id="precoInput" placeholder="Ex: 12.50">
    </div>
</div>

<button id="criarButton" disabled class="btn-submit" onclick="confirmarCriacao()">Criar Negociação</button>
<div id="status" class="status"></div>

<script>
const FUNCTION_API_NAME = "negociacaocontatoswidget";

// Responsável: usuário conectado por padrão; somente usuários ativos do CRM.
let responsaveisProntos = false;
let responsavelGeracao = 0;
let responsaveisAtivos = new Set();
async function carregarResponsaveis() {
    const generation = ++responsavelGeracao;
    responsaveisProntos = false;
    responsaveisAtivos = new Set();
    const select = document.getElementById("responsavelSelect");
    const status = document.getElementById("responsavelStatus");
    select.disabled = true;
    select.replaceChildren();
    status.textContent = "Carregando responsáveis...";
    try {
        const currentResponse = await ZOHO.CRM.CONFIG.getCurrentUser();
        const current = currentResponse?.users?.[0] || currentResponse;
        if (!current?.id) throw Error("Usuário conectado não identificado.");
        const users = new Map();
        let complete = false;
        for (let page = 1; page <= 10; page++) {
            const response = await ZOHO.CRM.API.getAllUsers({Type: "ActiveUsers", page, per_page: 200});
            if (!Array.isArray(response?.users) || response.code) throw Error("Lista de usuários indisponível.");
            for (const user of response.users) {
                if (user.status === "active" && /^\d+$/.test(String(user.id))) users.set(String(user.id), user);
            }
            if (response.info?.more_records === false || (response.info?.more_records !== true && response.users.length < 200)) { complete = true; break; }
        }
        if (!complete) throw Error("Lista de usuários incompleta.");
        if (generation !== responsavelGeracao) return;
        const currentId = String(current.id);
        if (!users.has(currentId)) throw Error("Usuário conectado não está disponível como responsável ativo.");
        for (const user of [...users.values()].sort((a,b) => String(a.full_name || a.last_name || a.id).localeCompare(String(b.full_name || b.last_name || b.id), "pt-BR"))) {
            const option = document.createElement("option");
            option.value = String(user.id);
            option.textContent = (user.full_name || user.last_name || user.id) + (option.value === currentId ? " (você)" : "");
            select.append(option);
        }
        responsaveisAtivos = new Set(users.keys());
        select.value = currentId;
        responsaveisProntos = true;
        select.disabled = false;
        status.textContent = "Pré-selecionado com seu usuário. Você pode escolher outro responsável.";
    } catch (error) {
        if (generation !== responsavelGeracao) return;
        status.textContent = "Não foi possível carregar os responsáveis. Reabra o formulário para tentar novamente.";
        select.replaceChildren();
        select.disabled = true;
    }
}
function responsavelSelecionado() {
    const id = document.getElementById("responsavelSelect").value;
    return responsaveisProntos && responsaveisAtivos.has(id) ? id : null;
}
let currentOppId = null;
let contextData = null;
let loading = true;
let creating = false;
let completed = false;

function setStatus(msg, type) {
    const status = document.getElementById("status");
    status.textContent = msg;
    status.className = "status " + (type || "");
    status.style.display = type ? "block" : "none";
}

function setOptions(id, placeholder, items = []) {
    const select = document.getElementById(id);
    select.replaceChildren();
    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = placeholder;
    select.appendChild(empty);
    for (const item of items) {
        const option = document.createElement("option");
        option.value = String(item.id);
        option.textContent = item.nome;
        select.appendChild(option);
    }
    select.value = "";
}

function atualizarCamposOpp() {
    const valor = document.getElementById("quantidadeOppInput").value;
    const quantidade = Number(valor);
    const preview = document.getElementById("qtdArredondada");
    if (valor === "") preview.textContent = "Qtd não informada.";
    else if (!Number.isFinite(quantidade) || quantidade < 0 || Math.round(quantidade) > 999999999) preview.textContent = "Informe uma quantidade válida, com Qtd até 999999999.";
    else preview.textContent = `Qtd que será gravada: ${Math.round(quantidade)} (arredondamento para inteiro).`;
    const moeda = document.getElementById("moedaOppSelect").value || "moeda não informada";
    document.querySelector('label[for="precoOppInput"]').textContent = `Preço (${moeda})`;
    document.querySelector('label[for="precoInput"]').textContent = `Preço Unitário Desejado (${moeda}, opcional)`;
}

function updateButton() {
    for (const id of ["quantidadeOppInput", "precoOppInput", "moedaOppSelect", "validadeOppInput", "qtdInput", "precoInput"]) {
        document.getElementById(id).disabled = loading || creating || completed || !contextData;
    }
    document.getElementById("responsavelSelect").disabled = loading || creating || completed || !responsaveisProntos;
    document.getElementById("criarButton").disabled = loading || creating || completed || !responsaveisProntos || !contextData || !document.getElementById("empresaSelect").value;
    document.getElementById("empresaSelect").disabled = loading || creating || completed || !contextData;
    document.getElementById("contatoSelect").disabled = loading || creating || completed || !document.getElementById("empresaSelect").value;
}

function parseZohoOutput(response) {
    let output = response?.details?.output ?? response?.output ?? response;
    while (typeof output === "string") {
        try { output = JSON.parse(output); } catch { return null; }
    }
    return output;
}

async function carregarDados() {
    loading = true;
    completed = false;
    contextData = null;
    document.getElementById("avisos").textContent = "";
    document.getElementById("dadosOpp").textContent = "";
    setOptions("empresaSelect", "Carregando empresas dos contatos associados...");
    setOptions("contatoSelect", "Selecione primeiro uma empresa");
    updateButton();
    if (!currentOppId) {
        loading = false;
        setStatus("ID da oportunidade não identificado.", "error");
        updateButton();
        return;
    }
    setStatus("Carregando Contacts associados à oportunidade...", "loading");
    try {
        await carregarResponsaveis();
        const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, {
            arguments: JSON.stringify({ oppId: currentOppId })
        });
        const output = parseZohoOutput(response);
        if (output?.status !== "success" || !Array.isArray(output.empresas)) {
            setOptions("empresaSelect", "Não foi possível carregar as empresas");
            setStatus(output?.message || "Erro ao carregar contatos associados.", "error");
            return;
        }
        contextData = output;
        const dados = output.dados_oportunidade || {};
        document.getElementById("dadosOpp").textContent = "Dados da Opp: revise os campos abaixo. Os valores finais serão copiados somente para esta negociação. Os campos desejados continuam separados.";
        document.getElementById("quantidadeOppInput").value = dados.quantidade ?? "";
        document.getElementById("precoOppInput").value = dados.preco_unitario ?? "";
        document.getElementById("moedaOppSelect").value = dados.moeda ?? "";
        document.getElementById("validadeOppInput").value = dados.validade_produto ?? "";
        atualizarCamposOpp();
        if (output.contatos_sem_empresa > 0) {
            document.getElementById("avisos").textContent = `${output.contatos_sem_empresa} contato(s) associado(s) sem empresa vinculada. Vincule uma empresa no cadastro do contato para utilizá-lo nesta ação.`;
        }
        if (output.empresas.length === 0) {
            setOptions("empresaSelect", "Nenhuma empresa elegível");
            setStatus("Nenhum parceiro disponível nos Contacts associados. Use Assign na lista Contacts da oportunidade e confira a empresa dos contatos.", "error");
            return;
        }
        setOptions("empresaSelect", "-- Selecione a Empresa --", output.empresas);
        setStatus("", "");
    } catch {
        setOptions("empresaSelect", "Erro ao carregar as empresas");
        setStatus("Erro de comunicação ao carregar os contatos. Reabra o formulário para tentar novamente.", "error");
    } finally {
        loading = false;
        updateButton();
    }
}

function aoSelecionarEmpresa() {
    const id = document.getElementById("empresaSelect").value;
    const empresa = contextData?.empresas.find(item => String(item.id) === id);
    setOptions("contatoSelect", empresa ? "-- Contato opcional --" : "Selecione primeiro uma empresa", empresa?.contatos || []);
    updateButton();
}

async function confirmarCriacao() {
    if (loading || creating || completed || !contextData) return;
    const responsavelId = responsavelSelecionado();
    if (!responsavelId) { setStatus("Selecione um responsável ativo.", "error"); return; }
    const empresaId = document.getElementById("empresaSelect").value;
    const contatoId = document.getElementById("contatoSelect").value;
    const empresa = contextData.empresas.find(item => String(item.id) === empresaId);
    if (!empresa || (contatoId && !empresa.contatos.some(item => String(item.id) === contatoId))) {
        setStatus("Selecione uma empresa e um contato elegíveis para esta oportunidade.", "error");
        return;
    }
    const valoresNegociacao = {
        quantidade: document.getElementById("quantidadeOppInput").value,
        preco_unitario: document.getElementById("precoOppInput").value,
        moeda: document.getElementById("moedaOppSelect").value,
        validade_produto: document.getElementById("validadeOppInput").value
    };
    creating = true;
    updateButton();
    setStatus("Criando negociação no CRM...", "loading");
    const tipo = (contextData.tipo_oportunidade || "").toLowerCase();
    const venda = tipo === "venda" || tipo === "sales";
    const sellerId = venda ? contextData.empresa_origem_id : empresaId;
    const sellerName = venda ? contextData.empresa_origem_nome : empresa.nome;
    const sellerContact = venda ? contextData.contato_origem_id : contatoId;
    const buyerId = venda ? empresaId : contextData.empresa_origem_id;
    const buyerName = venda ? empresa.nome : contextData.empresa_origem_nome;
    const buyerContact = venda ? contatoId : contextData.contato_origem_id;
    const lookup = id => id ? { id: String(id) } : null;
    const payload = {
        Owner: {id: responsavelId},
        Deal_Name: `[${contextData.produto_nome}] ${sellerName} x ${buyerName}`,
        Nome_Produto: lookup(contextData.produto_id),
        Account_Name: lookup(sellerId),
        Contact_Name: lookup(sellerContact),
        Empresa_Buyer: lookup(buyerId),
        Comprador1: lookup(buyerContact),
        Quantidade_Desejada: document.getElementById("qtdInput").value,
        Preco_Unitario_Desejado: document.getElementById("precoInput").value
    };
    try {
        const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, {
            arguments: JSON.stringify({ action: "criar_negocio", oppId: currentOppId, payload, referencia_origem: contextData.referencia_origem, valores_negociacao: valoresNegociacao })
        });
        const output = parseZohoOutput(response);
        if (output?.status === "success" && output.deal_id) {
            completed = true;
            setStatus("Negociação criada com sucesso! Redirecionando...", "success");
            ZOHO.CRM.UI.Record.open({ Entity: "Deals", RecordID: output.deal_id });
        } else {
            setStatus(output?.message || "Erro ao criar negociação. Confira o CRM antes de tentar novamente.", "error");
        }
    } catch {
        setStatus("Erro de comunicação. Confira se a negociação foi criada no CRM antes de tentar novamente.", "error");
    } finally {
        creating = false;
        updateButton();
    }
}

function registrarZoho() {
    if (typeof ZOHO === "undefined") {
        setTimeout(registrarZoho, 200);
        return;
    }
    ZOHO.embeddedApp.on("PageLoad", function(data) {
        const id = data?.EntityId ?? data?.EntityIdList ?? data?.recordId;
        currentOppId = Array.isArray(id) ? id[0] : id;
        carregarDados();
    });
    ZOHO.embeddedApp.init();
}
registrarZoho();

</script>
</body>
</html>
